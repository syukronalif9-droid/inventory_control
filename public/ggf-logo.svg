<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 150" width="100%" height="100%">
  <!-- Leaves and circle group -->
  <g transform="translate(180, 25)">
    <!-- Orange leaf (left) -->
    <path d="M 0 50 Q -30 20 10 30 Q 30 40 40 60 Q -10 60 0 50 Z" fill="#f59e0b" />
    <!-- Top green leaf -->
    <path d="M 40 30 Q 20 0 45 10 Q 60 20 50 45 Q 20 40 40 30 Z" fill="#a3e635" />
    <!-- Right yellow-green leaf -->
    <path d="M 60 40 Q 60 20 80 30 Q 90 40 85 55 Q 50 50 60 40 Z" fill="#bef264" />
    <!-- Blue circle -->
    <circle cx="70" cy="70" r="14" fill="#38bdf8" />
  </g>
  
  <!-- GGF Text -->
  <text x="30" y="110" font-family="Arial, sans-serif" font-weight="900" font-size="80" fill="#1f893e" letter-spacing="-3">GGF</text>
  
  <!-- Subtext -->
  <text x="245" y="80" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#1f893e" letter-spacing="-0.5">GREAT</text>
  <text x="245" y="98" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#1f893e" letter-spacing="-0.5">GIANT</text>
  <text x="245" y="116" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#1f893e" letter-spacing="-0.5">FOODS</text>
</svg>
